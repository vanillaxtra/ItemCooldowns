# MiniMessage works in every line. Gray is the body, white is the emphasis.
# Green is a success, red is a stop. The plugin does not recolor these.
version: 6

command:
  players-only: "<red>Only players can open this GUI."
  no-permission: "<red>You don't have permission to do that."
  reloaded: "<green>Reloaded."
  usage: "<gray>Usage: <white>/itemcooldowns</white> [reload]</gray>"
  set-usage: "<gray>Usage: <white>/setcooldown <item> <seconds></white></gray>"
  get-usage: "<gray>Usage: <white>/getcooldown <item></white></gray>"
  reset-usage: "<gray>Usage: <white>/resetcooldown <item></white> or <white>all</white></gray>"
  set-ok: "<gray>Set <white>{item}</white> to <white>{seconds}s</white>.</gray>"
  get-ok: "<gray>{item}: <white>{seconds}s</white></gray>"
  get-none: "<gray>No cooldown for <white>{item}</white>.</gray>"
  reset-one: "<green>Removed cooldowns for {item}."
  reset-all: "<green>Removed every cooldown."
  bad-item: "<red>That item name isn't valid."

gui:
  title:
    list: "<white>Item Cooldowns"
    editor: "<white>Edit Cooldown"
    presets: "<white>Presets"
    confirm: "<white>Drop to remove"
  help-name: "<white>How this works"
  list-lore: "<gray>Click a rule to edit it.</gray> <dark_gray>·</dark_gray> <gray>The <green>emerald</green> uses what you are holding.</gray>"
  presets: "<white>Presets"
  presets-lore: "<gray>Click one to add it and open the rule.</gray>"
  category-lore: "<gray>Click a type to turn it on or off.</gray>"
  preset-category-count: "<white>{on}<gray>/{total} on</gray></white>"
  add: "<green>Add a rule"
  previous: "<gray>Previous page"
  next: "<gray>Next page"
  back: "<gray>Back"
  save: "<green>Save rule"
  delete: "<red>Remove"
  confirm: "<green>Remove this rule"
  cancel: "<gray>Keep it"
  saved: "<green>Cooldown saved"
  deleted: "<gray>Removed"
  need-item: "<red>Put an item in the middle first"
  need-time: "<red>Set a time first"
  duplicate: "<red>That exact match already has a rule"
  editor-book: "<white>Cooldown"
  editor-lore: "<gray>One timer per item.</gray> <dark_gray>·</dark_gray> <key:key.mouse.right> <gray>use</gray> <dark_gray>·</dark_gray> <key:key.mouse.left> <gray>attack</gray>"
  editor-group-lore: "<gray>Every spear shares this timer.</gray> <dark_gray>·</dark_gray> <gray>Click a type below to turn it off.</gray>"
  group-select-all: "<dark_gray>Click to turn every type on"
  need-one-type: "<red>Turn on at least one type"
  item-slot: "<white>Item"
  item-slot-empty: "<dark_gray>Drop an item here"
  time: "<white>Cooldown"
  drop-hint: "<dark_gray>Pick this up, then drop it outside the menu</dark_gray>"
  left: "<white>Left click"
  right: "<white>Right click"
  seconds-off: "<dark_gray>Off"
  seconds-on: "<white>{seconds}s"
  adjust-hint: "<dark_gray><key:key.mouse.left> +1</dark_gray>  <dark_gray><key:key.mouse.right> -1</dark_gray>  <dark_gray>Shift ±5</dark_gray>"
  cooldown-use: "<key:key.mouse.right> <white>{seconds}s</white>  <dark_gray>use</dark_gray>"
  cooldown-attack: "<key:key.mouse.left> <white>{seconds}s</white>  <dark_gray>attack</dark_gray>"
  cooldown-off-use: "<dark_gray><key:key.mouse.right> off</dark_gray>  <dark_gray>use</dark_gray>"
  cooldown-off-attack: "<dark_gray><key:key.mouse.left> off</dark_gray>  <dark_gray>attack</dark_gray>"
  cooldown-unset: "<dark_gray>Add an item to show <key:key.mouse.left> or <key:key.mouse.right></dark_gray>"
  match-potion-on: "<white>This potion only"
  match-potion-off: "<gray>Any potion in this bottle"
  match-cmd-on: "<white>This custom model only"
  match-cmd-off: "<gray>Every item of this type"
  match-model-on: "<white>This item model only"
  match-model-off: "<gray>Ignore item model"
  rule-time: "<white>{seconds}</white>"
  rule-left: "<gray>Left click  <white>{seconds}</white></gray>"
  rule-right: "<gray>Right click  <white>{seconds}</white></gray>"
  rule-group-count: "<dark_gray>{on}/{total} spear types on</dark_gray>"
  rule-match-all: "<dark_gray>All of this item"
  rule-match-potion: "<dark_gray>{value}</dark_gray>"
  rule-match-cmd: "<dark_gray>Model <white>{value}</white></dark_gray>"
  rule-match-model: "<dark_gray>Item model <white>{value}</white></dark_gray>"
  preset-lore: "<gray>Adds this cooldown."
  preset-time: "<white>{seconds}s"
  preset-time-right: "<white>{seconds}s"
  preset-time-left: "<white>{seconds}s"
  preset-time-both: "<white>{seconds}s"
  preset-name:
    ender-pearl: "<white>Ender Pearl"
    trident: "<white>Trident"
    wind-charge: "<white>Wind Charge"
    mace: "<white>Mace"
    spear: "<white>Spear"
    spear-lore: "<dark_gray>All tiers · one timer</dark_gray>"
    chorus: "<white>Chorus Fruit"
    firework: "<white>Firework Rocket"
    golden-apple: "<white>Golden Apple"
    enchanted-apple: "<white>Enchanted Golden Apple"
    turtle: "<white>Turtle Master"
    turtle-lore: "<dark_gray>Drink, splash & lingering</dark_gray>"
    healing: "<white>Instant Health"
    healing-lore: "<dark_gray>Drink, splash & lingering</dark_gray>"
    potions: "<white>Potions"
    potions-lore: "<gray>Turtle Master and Instant Health"
  preset-added: "<green>Added {count}"
  preset-exists: "<red>That preset is already added"
  on-cooldown: "<red><key:key.mouse.right> blocked</red> <white>{seconds}s</white>"
