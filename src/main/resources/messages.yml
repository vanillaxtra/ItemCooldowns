  kind-lunge: "<dark_gray>Lunge</dark_gray>"
  cooldown-use: "<white>{seconds}s cooldown</white>"
  cooldown-attack: "<white>{seconds}s cooldown</white>"
  cooldown-lunge: "<white>{seconds}s cooldown</white>"
  cooldown-off-use: "<red>ᴅɪsᴀʙʟᴇᴅ</red>"
  cooldown-off-attack: "<red>ᴅɪsᴀʙʟᴇᴅ</red>"
  cooldown-off-lunge: "<red>ᴅɪsᴀʙʟᴇᴅ</red>"
  cooldown-unset: "<dark_gray>Put an item in the empty slot</dark_gray>"
