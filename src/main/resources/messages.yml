# MiniMessage works in every line. Gray is the body, white is the emphasis.
# Green is a success, red is a stop. The plugin does not recolor these.
version: 2

command:
  players-only: "<red>Only players can open this GUI."
  no-permission: "<red>You don't have permission to do that."
  reloaded: "<green>Reloaded."
  usage: "<gray>Usage: <white>/itemcooldowns</white> [reload]</gray>"
  set-usage: "<gray>Usage: <white>/setcooldown <item> <seconds></white></gray>"
  get-usage: "<gray>Usage: <white>/getcooldown <item></white></gray>"
  reset-usage: "<gray>Usage: <white>/resetcooldown <item></white> or <white>all</white></gray>"
  set-ok: "<gray>Set <white>{item}</white> to <white>{seconds}s</white>.</gray>"
  get-ok: "<gray>{item}: left <white>{left}s</white>, right <white>{right}s</white>.</gray>"
  get-none: "<gray>No cooldown for <white>{item}</white>.</gray>"
  reset-one: "<green>Removed cooldowns for {item}."
  reset-all: "<green>Removed every cooldown."
  bad-item: "<red>That item name isn't valid."

gui:
  title:
    list: "<white>Item Cooldowns"
    editor: "<white>Edit Cooldown"
    presets: "<white>Presets"
    confirm: "<white>Delete this rule"
  help-name: "<white>How this works"
  list-lore: "<gray>Click a rule to change it. The <green>emerald</green> adds whatever you are holding. Presets are in the <white>bottom right</white>.</gray>"
  presets: "<white>Presets"
  presets-lore: "<gray>Click one to add it with a ready cooldown.</gray>"
  add: "<green>Add a rule"
  previous: "<gray>Previous page"
  next: "<gray>Next page"
  back: "<gray>Back"
  save: "<green>Save rule"
  delete: "<red>Delete rule"
  confirm: "<green>Remove this rule"
  cancel: "<red>Cancel"
  saved: "<green>Cooldown saved"
  deleted: "<red>Cooldown removed"
  need-item: "<red>Put an item in the middle first"
  need-time: "<red>Set a left or right click time first"
  duplicate: "<red>That exact match already has a rule"
  editor-book: "<white>Cooldown editor"
  editor-lore: "<gray>Put the item in the middle. Use items only show a right-click time. Click the time to change it.</gray>"
  item-slot: "<white>Item to cooldown"
  item-slot-empty: "<gray>Click an item in your inventory, or drop one here."
  left: "<white>Left click"
  right: "<white>Right click"
  seconds-off: "<gray>Off"
  seconds-on: "<white>{seconds}s"
  adjust-hint: "<dark_gray>Left +1  Right -1  Shift ±5"
  match-potion-on: "<white>This potion only"
  match-potion-off: "<gray>Any potion of this bottle"
  match-cmd-on: "<white>This custom model only"
  match-cmd-off: "<gray>Every item of this type"
  match-model-on: "<white>This item model only"
  match-model-off: "<gray>Ignore item model"
  rule-left: "<gray>Left click  <white>{seconds}</white></gray>"
  rule-right: "<gray>Right click  <white>{seconds}</white></gray>"
  rule-match-all: "<dark_gray>All of this item"
  rule-match-potion: "<gray>{value}</gray>"
  rule-match-cmd: "<gray>Custom model <white>{value}</white></gray>"
  rule-match-model: "<gray>Model <white>{value}</white></gray>"
  preset-lore: "<gray>Adds this cooldown."
  preset-time-right: "<white>{seconds}s <gray>right click</gray></white>"
  preset-time-left: "<white>{seconds}s <gray>left click</gray></white>"
  preset-time-both: "<white>{seconds}s <gray>left and right click</gray></white>"
  preset-name:
    ender-pearl: "<white>Ender Pearl"
    trident: "<white>Trident"
    wind-charge: "<white>Wind Charge"
    mace: "<white>Mace"
    spear: "<white>Spear"
    spear-lore: "<gray>Every spear"
    chorus: "<white>Chorus Fruit"
    firework: "<white>Firework Rocket"
    golden-apple: "<white>Golden Apple"
    enchanted-apple: "<white>Enchanted Golden Apple"
    turtle: "<white>Turtle Master"
    turtle-lore: "<gray>Regular, long, and strong · drink, splash, lingering"
    healing: "<white>Instant Health II"
    healing-lore: "<gray>Drink, splash, and lingering"
  preset-added: "<green>Added {count}"
  preset-exists: "<red>That preset is already added"
  on-cooldown: "<red>Cooldown <white>{seconds}s</white></red>"
