  rule-right: "<gray>Right click  <white>{seconds}</white></gray>"
  rule-group-count: "<dark_gray>{on}/{total} types</dark_gray>"
  rule-match-all: "<dark_gray>All of this item"
  rule-match-potion: "<dark_gray>{value}</dark_gray>"
  rule-match-cmd: "<dark_gray>Model <white>{value}</white></dark_gray>"
  rule-match-model: "<dark_gray>Item model <white>{value}</white></dark_gray>"
  preset-lore: "<gray>Adds this cooldown."
