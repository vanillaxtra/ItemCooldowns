name: ItemCooldowns
version: '${version}'
main: net.mattwhyy.itemcooldowns.ItemCooldownsPlugin
api-version: '${apiVersion}'
authors: [mattwhyy]
description: Set left-click and right-click cooldowns for items, potions, and custom models
commands:
  itemcooldowns:
    description: Open the cooldown menu
    usage: /itemcooldowns [reload]
    aliases: [icd, cooldowns]
    permission: itemcooldowns.admin
  setcooldown:
    description: Set a cooldown for an item
    usage: /setcooldown <item> <seconds>
    permission: itemcooldowns.set
  resetcooldown:
    description: Reset a cooldown or all cooldowns
    usage: /resetcooldown <item|all>
    permission: itemcooldowns.reset
  getcooldown:
    description: Check an item's cooldown
    usage: /getcooldown <item>
    permission: itemcooldowns.get
permissions:
  itemcooldowns.admin:
    description: Open the cooldown GUI and reload
    default: op
  itemcooldowns.set:
    description: Allows setting item cooldowns
    default: op
  itemcooldowns.reset:
    description: Allows resetting item cooldowns
    default: op
  itemcooldowns.get:
    description: Allows checking an item's cooldown
    default: op
